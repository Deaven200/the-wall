<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wall - Tower Defense Automation Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="game-wrapper">
            <canvas id="gameCanvas"></canvas>
            
            <div class="sidebar">
                <div class="panel">
                    <div class="stat">
                        <span class="label">Resources:</span>
                        <span class="value" id="resourceCount">0</span>
                    </div>
                </div>
                
                <div class="panel">
                    <div class="stat">
                        <span class="label">Wall Health:</span>
                        <span class="value" id="wallHealth">100</span>
                    </div>
                </div>
                
                <div class="panel">
                    <div class="stat">
                        <span class="label">Turrets:</span>
                        <span class="value" id="turretCount">0</span>
                    </div>
                </div>

                <div class="panel">
                    <p class="cost">Cost: <span id="turretCost">20</span></p>
                    <button id="buildTurretBtn" class="btn btn-build">Build Turret</button>
                </div>

                <div class="panel">
                    <h3>Patches</h3>
                    <div id="resourceList" class="resource-list">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
